[project]
name = "dependency-security-demo"
version = "0.1.0"
description = "Hands-on exercises: Python dependency / supply-chain security (learning package)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv*", "ex5_confusion_typosquatting/indexes", "dist"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "scripts"
exclude = ["\\.venv", "indexes/", "dist/"]

[[tool.mypy.overrides]]
module = ["setuptools", "setuptools.*", "requests", "requests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
