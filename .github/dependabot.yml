# Dependabot: version updates on a schedule + security updates (enable in repo Settings).
# Docs: https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  # Vulnerable demo deps live here (requirements.txt).
  - package-ecosystem: "pip"
    directory: "/ex1_known_vulns"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    # Version updates wait after a release; security updates are NOT delayed.
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
