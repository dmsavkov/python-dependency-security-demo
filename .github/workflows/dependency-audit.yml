# CI gate: fail the job when pip-audit finds a known vulnerability (exit code 1).
name: dependency-audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - run: pip-audit -r ex1_known_vulns/requirements.txt --strict
